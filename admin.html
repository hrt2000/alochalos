<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alochalos Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <div class="container admin-header">
      <h1>مدیریت محصولات Alochalos</h1>
      <a class="btn btn-secondary" href="index.html">بازگشت به سایت</a>
    </div>
  </header>

  <main class="admin-shell">
    <div class="container admin-grid">
      <aside class="admin-panel">
        <h2>اتصال</h2>
        <div class="login-row">
          <label>GitHub token
            <input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_..." />
          </label>
          <div class="admin-actions">
            <button class="btn btn-primary" type="button" id="connectButton">اتصال</button>
            <button class="btn btn-muted" type="button" id="loadButton">بارگذاری</button>
            <button class="btn btn-muted" type="button" id="logoutButton">خروج</button>
          </div>
        </div>
        <div id="adminStatus" class="status-box"></div>
      </aside>

      <section class="admin-panel">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Catalog</span>
            <h2>محصولات</h2>
          </div>
          <div class="admin-actions">
            <button class="btn btn-muted" type="button" id="newButton">محصول جدید</button>
            <button class="btn btn-primary" type="button" id="publishButton">Publish</button>
          </div>
        </div>

        <div class="admin-grid">
          <div class="product-list" id="productList"></div>

          <form class="admin-form" id="productForm">
            <div class="form-grid">
              <label>ID
                <input name="id" required />
              </label>
              <label>دسته‌بندی
                <select name="category">
                  <option value="laptops">لپ‌تاپ</option>
                  <option value="desktops">کامپیوتر</option>
                  <option value="mobile">موبایل</option>
                  <option value="printers">پرینتر</option>
                  <option value="monitors">مانیتور</option>
                  <option value="parts">قطعات</option>
                  <option value="accessories">لوازم جانبی</option>
                  <option value="networking">شبکه</option>
                </select>
              </label>
              <label>وضعیت
                <select name="status">
                  <option value="inStock">موجود</option>
                  <option value="available">قابل سفارش</option>
                  <option value="service">خدمات</option>
                  <option value="soldOut">ناموجود</option>
                </select>
              </label>
              <label>Image URL
                <input name="image" type="url" placeholder="https://..." />
              </label>

              <label>عنوان فارسی
                <input name="title_fa" required />
              </label>
              <label>عنوان English
                <input name="title_en" required />
              </label>
              <label>عنوان Azerbaijani
                <input name="title_az" required />
              </label>
              <label>قیمت فارسی
                <input name="price_fa" required />
              </label>
              <label>Price English
                <input name="price_en" required />
              </label>
              <label>Qiymət Azerbaijani
                <input name="price_az" required />
              </label>

              <label class="full">توضیح فارسی
                <textarea name="description_fa" rows="3" required></textarea>
              </label>
              <label class="full">Description English
                <textarea name="description_en" rows="3" required></textarea>
              </label>
              <label class="full">Təsvir Azerbaijani
                <textarea name="description_az" rows="3" required></textarea>
              </label>
              <label class="full">Specs
                <textarea name="specs" rows="3" placeholder="Intel Core i5, 16GB RAM, 512GB SSD"></textarea>
              </label>
            </div>

            <div class="form-actions">
              <button class="btn btn-primary" type="submit">ذخیره در لیست</button>
              <button class="btn btn-danger" type="button" id="deleteButton">حذف محصول</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
